<style>
:root{--desk:#2a2420;--desk2:#3b322b;--paper:#fbf6ea;--ink:#1d1a16;--muted:#5d554a;--accent:#c4512b;--river:#2d6f8f;--bubble:#fffdf8;--ia:#e8f3fb;--ia-ink:#123a52;--cap:#f7e38a}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:radial-gradient(ellipse at center,var(--desk2),var(--desk));color:var(--ink);font:16px/1.4 "Comic Neue",system-ui,sans-serif}
.toolbar{position:fixed;inset:0 0 auto 0;height:52px;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(20,17,15,.85);color:#f3ead8}
.toolbar .t{font:400 22px Bangers,cursive;letter-spacing:1px}
.toolbar .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toolbar button{font:700 14px "Comic Neue";background:#f3ead8;color:#1d1a16;border:2px solid #1d1a16;border-radius:9px;padding:5px 9px;cursor:pointer}
.toolbar button[aria-pressed=true]{background:var(--accent);color:#fff}
.vol{display:flex;align-items:center;gap:4px;font-size:13px}
#pg{font-size:13px;min-width:92px;text-align:center}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7cc0e0;outline-offset:2px}
.stage{position:fixed;inset:52px 0 0 0;display:grid;place-items:center;perspective:2600px}
.book{position:relative;transition:transform .8s ease}
.nav{position:fixed;top:50%;z-index:15;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:3px solid #f3ead8;background:rgba(0,0,0,.45);color:#f3ead8;font:700 22px sans-serif;cursor:pointer}
.nav:disabled{opacity:.25;cursor:default}
#prev{left:10px}#next{right:10px}
/* Hojas (modo doble página) */
.sheet{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.3,1)}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;overflow:hidden;transition:visibility 0s .45s}
.sheet.flipped .face.front,.sheet:not(.flipped) .face.back{visibility:hidden}
.face.back{transform:rotateY(180deg)}
/* Modo una página */
.book.single .sheet{display:none}
.single-host{position:absolute;inset:0;display:none}
.book.single .single-host{display:block}
.single-host .page{animation:turn .55s ease}
@keyframes turn{from{transform:rotateY(-70deg);opacity:0;transform-origin:left center}to{transform:none;opacity:1}}
/* Página */
.page{position:absolute;inset:0;background:var(--paper);container-type:size;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.face.front .page{box-shadow:inset 18px 0 22px -16px rgba(0,0,0,.35)}
.face.back .page{box-shadow:inset -18px 0 22px -16px rgba(0,0,0,.35)}
.single-host .page{box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pnum{position:absolute;bottom:1.6cqh;left:0;right:0;text-align:center;font:400 2.6cqw Bangers,cursive;color:var(--muted)}
.inner{position:absolute;inset:4cqw 4.5cqw 6cqh}
.inner.scene{display:flex;flex-direction:column;justify-content:center}
/* Escena */
.scene h2{font:400 5.4cqw/1 Bangers,cursive;letter-spacing:.06em;margin:0 0 1.2cqh}
.scene h2 span{color:var(--accent)}
.caption{margin:0 0 1.6cqh;background:var(--cap);border:.5cqw solid #1d1a16;padding:.9cqw 1.6cqw;font-weight:700;font-size:2.55cqw;box-shadow:.7cqw .7cqw 0 #1d1a16}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw}
.grid .panel.a{grid-column:1/-1}
.grid.solo-b .panel.b{grid-column:1/-1;width:60%;justify-self:center}
.panel{position:relative;border:.6cqw solid var(--ink);border-radius:.6cqw;overflow:hidden;background:#000;aspect-ratio:3/2;cursor:pointer;container-type:inline-size}
.panel img{display:block;width:100%;height:100%;object-fit:cover}
.panel.miss{display:none}
.corner{position:absolute;display:flex;flex-direction:column;gap:1.2cqw;max-width:46%;z-index:2;pointer-events:none}
.c-tl{left:2%;top:3%;align-items:flex-start}.c-tr{right:2%;top:3%;align-items:flex-end}
.c-bl{left:2%;bottom:4%;align-items:flex-start;flex-direction:column-reverse}.c-br{right:2%;bottom:4%;align-items:flex-end;flex-direction:column-reverse}
.panel.b .corner,.panel.c .corner{max-width:44%}
.say{background:var(--bubble);color:#1d1a16;border:.45cqw solid #1d1a16;border-radius:2.6cqw;padding:.9cqw 1.8cqw;font-size:max(9px,2.7cqw);line-height:1.22;box-shadow:.3cqw .45cqw 0 rgba(0,0,0,.35);pointer-events:auto;margin:0;
  opacity:0;transform:scale(.96);transition:.25s}
.panel.b .say,.panel.c .say{font-size:max(9px,4.5cqw);border-width:.7cqw}
.say[hidden]{display:none}
.say.show{opacity:1;transform:none}
.say.now{outline:.5cqw solid var(--accent);outline-offset:.3cqw}
.say b{font-family:Bangers,cursive;font-weight:400;letter-spacing:.05em;font-size:1.1em;margin-right:.4em}
.say.ia{background:var(--ia);color:var(--ia-ink);border-radius:.8cqw;font-family:"IBM Plex Mono",monospace;border-style:dashed}
.say .acot{color:#5d554a;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:1.4cqw;align-items:center;margin-top:1.6cqh}
.pbtn{font:700 2.4cqw "Comic Neue";border:.4cqw solid var(--ink);background:var(--accent);color:#fff;padding:.7cqw 1.6cqw;border-radius:1.4cqw;cursor:pointer;box-shadow:.4cqw .4cqw 0 var(--ink);text-decoration:none}
.pbtn.alt{background:#fff;color:var(--ink)}
.hot{position:absolute;border:3px dashed #fff;background:rgba(255,255,255,.12);cursor:pointer;border-radius:4px;animation:pulse 1.6s infinite;z-index:3}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,.25)}}
.pop{position:absolute;left:5%;right:5%;bottom:9cqh;z-index:6;display:none;background:#fff;border:.5cqw solid var(--accent);border-radius:1.6cqw;padding:1.6cqw 2.2cqw;font-size:2.5cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.35)}
.pop.open{display:block}.pop p{margin:.6em 0}
.pop mark{background:#ffd2c2;text-decoration:underline wavy #c4512b}
.pop .x{position:absolute;right:1cqw;top:.6cqw;border:0;background:none;font-size:3.4cqw;cursor:pointer}
/* Portada, finales */
.bleed{position:absolute;inset:0}.bleed img{width:100%;height:100%;object-fit:cover;display:block}
.cover-t{position:absolute;left:0;right:0;top:6cqh;text-align:center;color:#fff;padding:0 6cqw}
.cover-t .k{font:700 2.6cqw "Comic Neue";letter-spacing:.3em;text-transform:uppercase;text-shadow:0 2px 6px #000}
.cover-t h1{font:400 13cqw/.9 Bangers,cursive;letter-spacing:.04em;margin:1.5cqh 0;text-shadow:.6cqw .6cqw 0 #000,0 0 3cqw rgba(0,0,0,.5)}
.cover-t p{font-size:3.1cqw;font-weight:700;text-shadow:0 2px 6px #000;margin:0}
.cover-b{position:absolute;left:0;right:0;bottom:4cqh;text-align:center;color:#fff;font-size:2.4cqw;text-shadow:0 2px 6px #000}
.textpage h2{font:400 6cqw Bangers,cursive;margin:0 0 2cqh;color:var(--accent)}
.textpage p,.textpage li{font-size:2.75cqw;margin:0 0 1.4cqh}
.textpage ul{padding-left:4cqw;margin:0 0 2cqh}
.textpage .small{font-size:2.2cqw;color:var(--muted)}
.back-t{position:absolute;left:8cqw;right:8cqw;top:30cqh;background:rgba(251,246,234,.92);border:.5cqw solid #1d1a16;padding:3cqw;font-size:2.8cqw;box-shadow:1cqw 1cqw 0 #1d1a16}
.back-t h3{font:400 5cqw Bangers,cursive;margin:0 0 1.5cqh}
.fin-t{position:absolute;left:0;right:0;top:7cqh;text-align:center;color:#fff}
.fin-t h2{font:400 16cqw/1 Bangers,cursive;margin:0;text-shadow:.6cqw .6cqw 0 #000}
.fin-t p{font-size:3.3cqw;font-weight:700;text-shadow:0 2px 6px #000;margin:1cqh 6cqw}
.ask-t{position:absolute;left:6cqw;right:6cqw;top:6cqh;text-align:center}
.ask-t .say{display:inline-block;opacity:1;transform:none;font-size:3.6cqw}
.ask-box{position:absolute;left:8cqw;right:8cqw;bottom:12cqh;text-align:center}
.ask-box label{display:block;color:#fff;font:400 5.5cqw Bangers,cursive;text-shadow:.4cqw .4cqw 0 #000}
.ask-box input{width:100%;font:700 3.2cqw "Comic Neue";padding:1.4cqw 2cqw;border:.5cqw solid #1d1a16;border-radius:2cqw}
.ask-box output{display:block;margin-top:2cqh;color:#fff;font:700 4.2cqw "Comic Neue";text-shadow:0 2px 6px #000;min-height:1.4em}
@media (prefers-reduced-motion:reduce){.sheet,.book,.say{transition:none}.single-host .page{animation:none}.hot{animation:none}}
@media (max-width:640px){.toolbar .t{display:none}.vol{display:none}#all{display:none}.toolbar button{font-size:12px;padding:4px 7px}.nav{top:auto;bottom:10px;transform:none;width:40px;height:40px;font-size:18px}.stage{bottom:60px}}
</style>
</head>

  if(s.hot)h+=`<div class="pop" role="dialog" aria-label="Dato revelado"><button class="x" aria-label="Cerrar">✕</button><p>Lo que dijo la IA: «Según la Secretaría Ambiental, <mark>el 87 % de la contaminación del caño proviene del barrio Villa Esmeralda</mark>».</p><p><strong>⚠ Dato inventado.</strong> El barrio no existe y la cifra no tiene fuente. <strong>¿Cómo lo comprobarías?</strong> Busca la fuente original, pregunta a quien vive allí y compara con otra fuente.</p></div>`;
  if(s.audio)h+=`<div class="pop trx" role="dialog" aria-label="Transcripción"><button class="x" aria-label="Cerrar">✕</button><p>[Río tranquilo, aves.] Don Aurelio: «Cuando yo era pelao, el caño bajaba claro. Uno metía la atarraya y salía llena… Cuando la gente le dio la espalda, el caño se volvió el patio de atrás de todo el mundo.»</p></div>`;
  h+=`</div><div class="pnum">${n+2}</div>`;
  const pg=mk(h,s.amb,'scenep');
  pg.querySelectorAll('.panel').forEach(pn=>pn.insertAdjacentHTML('beforeend','<div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>'));
  const dl=solo?s.d.slice(0,3):s.d;
  const says=dl.map((d,j)=>{const [pn,c]=POS[n][j],e=document.createElement('p');e.className='say'+(d[3]?' ia':'');e.hidden=true;e.dataset.who=d[0];e.dataset.exp=(EXP[n]||[])[j]||'';
    e.innerHTML=`<b>${d[0]}</b>${d[2]?`<span class="acot">(${d[2]}) </span>`:''}${d[1]}`;pg.querySelector(`.panel.${pn} .c-${c}`).appendChild(e);return e});
  const nb=pg.querySelector('.next');let k=0;
  const step=()=>{if(k<says.length){says.forEach(x=>x.classList.remove('now'));const e=says[k++];e.hidden=false;requestAnimationFrame(()=>e.classList.add('show','now'));expr(e.dataset.exp,e.dataset.who)}
    if(k>=says.length)nb.textContent='Pasar página ▸'};
  nb.onclick=()=>{if(k>=says.length){turn(1);return}step()};
  pg.querySelectorAll('.panel img').forEach(im=>im.addEventListener('click',step));
  pg._show=()=>{while(k<says.length)step()};pg._step=()=>{if(k>=says.length)return false;step();return true};
  pg.querySelectorAll('.pop .x').forEach(b=>b.onclick=()=>b.parentNode.classList.remove('open'));
  const hot=pg.querySelector('.hot');if(hot)hot.onclick=e=>{e.stopPropagation();pg.querySelector('.pop').classList.add('open')};
  const trx=pg.querySelector('#trx');if(trx)trx.onclick=()=>pg.querySelector('.pop.trx').classList.toggle('open');
  scenes.push(pg)});

/* ---------- Motor del cuadernillo ---------- */
const book=document.getElementById('book'),single=document.getElementById('single'),N=PAGES.length;
let pos=0,mode=null,sheets=[];   // pos = índice de la página de la derecha (doble) o página visible (simple)
function size(){const W=innerWidth,H=innerHeight-52,dbl=W>=900&&W>H*1.05;
  let ph=Math.min(H-(dbl?28:84),1100),pw=ph*0.78;const cols=dbl?2:1,maxw=W-(dbl?120:24);
  if(pw*cols>maxw){pw=maxw/cols;ph=pw/0.78}
  book.style.width=pw*cols+'px';book.style.height=ph+'px';return dbl}
function build(){const dbl=size(),m=dbl?'double':'single';if(m===mode){place();return}mode=m;
  sheets.forEach(s=>s.remove());sheets=[];single.innerHTML='';book.classList.toggle('single',!dbl);
  if(dbl){for(let i=0;i<N;i+=2){const sh=document.createElement('div');sh.className='sheet';
      const f=document.createElement('div');f.className='face front';f.appendChild(PAGES[i]);sh.appendChild(f);
      if(PAGES[i+1]){const b=document.createElement('div');b.className='face back';b.appendChild(PAGES[i+1]);sh.appendChild(b)}
      book.appendChild(sh);sheets.push(sh)}
    pos=pos%2?pos+1:pos}
  place()}
function place(){
  if(mode==='double'){const k=pos/2;sheets.forEach((s,i)=>{const fl=i<k;s.classList.toggle('flipped',fl);s.style.zIndex=fl?i+1:sheets.length-i});
    const w=parseFloat(book.style.width);book.style.transform=pos===0?`translateX(${-w/4}px)`:pos>=N?`translateX(${w/4}px)`:'none'}
  else{single.innerHTML='';if(PAGES[pos]){single.appendChild(PAGES[pos]);}}
  const vis=visiblePages();pg.textContent=vis.length?'Pág. '+vis.map(i=>i+1).join('–')+' / '+N:'';
  prev.disabled=pos<=0;next.disabled=mode==='double'?pos>=N:pos>=N-1;
  const amb=(vis.map(i=>PAGES[i].dataset.amb).filter(Boolean).pop())||'barrio';setAmb(amb)}
function visiblePages(){return mode==='double'?[pos-1,pos].filter(i=>i>=0&&i<N):[pos]}
function turn(d){if(mode==='double'){pos=Math.max(0,Math.min(N,pos+2*d))}else{pos=Math.max(0,Math.min(N-1,pos+d))}place()}
const prev=document.getElementById('prev'),next=document.getElementById('next'),pg=document.getElementById('pg');
prev.onclick=()=>{stopAuto();turn(-1)};next.onclick=()=>{stopAuto();turn(1)};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){stopAuto();turn(1)}if(e.key==='ArrowLeft'){stopAuto();turn(-1)}});
let tx=null;book.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){stopAuto();turn(dx<0?1:-1)}tx=null});
addEventListener('resize',build);
const q=PAGES[10].querySelector('#q');q.oninput=()=>{q.parentNode.querySelector('output').textContent=q.value?'«'+q.value+'»':''};
document.getElementById('all').onclick=()=>scenes.forEach(s=>s._show());

/* Lectura automática: muestra los globos de las páginas visibles y pasa la página */
const ab=document.getElementById('auto');let auto=null;
const wait=ms=>new Promise(r=>auto.t=setTimeout(r,ms));
async function play(){while(auto){const vis=visiblePages().map(i=>PAGES[i]);
    for(const p of vis){if(!auto)return;if(p._step){while(auto&&p._step()){const e=p.querySelector('.say.now');await wait(1800+(e?e.textContent.length:20)*55)}}else await wait(3500)}
    if(!auto)return;if(next.disabled){stopAuto();return}turn(1);await wait(1300)}}
function stopAuto(){if(auto)clearTimeout(auto.t);auto=null;ab.setAttribute('aria-pressed','false');ab.textContent='▶ Lectura automática'}
ab.onclick=()=>{if(auto){stopAuto();return}auto={};ab.setAttribute('aria-pressed','true');ab.textContent='⏸ Pausar lectura';play()};

/* Sonido sintetizado (Web Audio). Nunca arranca solo. Ambiente suave de fondo + eventos esporádicos + expresiones. */
let ctx,master,amb={},on=false,cur=null,visible='barrio',noiseBuf;
const OUT={barrio:1,rio:1};
const SND={},FILES=['amb_rio','amb_aves','amb_viento','hmm_h','hmm_m','risa_yeimi','risa_mariana','risa_aurelio','asombro_f','asombro_m','oh','suspiro_f','suspiro_m','asco'];
function loadSamples(){FILES.forEach(f=>fetch('sonidos/'+f+'.mp3').then(r=>r.arrayBuffer()).then(b=>ctx.decodeAudioData(b)).then(a=>{SND[f]=a;if(f==='amb_rio'&&amb.rio)rioLoop()}).catch(()=>{}))}
function playS(name,gain,offset,dur){const b=SND[name];if(!b)return false;const src=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;src.buffer=b;
  const off=offset||0,d=dur||b.duration-off;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.4*(dur?1:0)+.02);g.gain.setValueAtTime(gain,t+Math.max(.03,d-(dur?.8:.05)));g.gain.linearRampToValueAtTime(0,t+d);
  src.connect(g).connect(master);src.start(t,off,d);return true}
let rioSrc=null;
function rioLoop(){if(rioSrc||!SND.amb_rio||!amb.rio)return;rioSrc=ctx.createBufferSource();rioSrc.buffer=SND.amb_rio;rioSrc.loop=true;const g=ctx.createGain();g.gain.value=.6;rioSrc.connect(g).connect(amb.rio);rioSrc.start()}
function nz(){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start();return s}
function filt(type,f,q){const x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x}
function lfo(rate,depth,target){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=rate;g.gain.value=depth;o.connect(g).connect(target);o.start()}
function layer(out,type,f,q,gain,mod){const g=ctx.createGain();g.gain.value=gain;nz().connect(filt(type,f,q)).connect(g).connect(out);if(mod)lfo(mod[0],mod[1],g.gain);return g}
function make(t){const g=ctx.createGain();g.gain.value=0;g.connect(master);
  if(t==='rio'){layer(g,'lowpass',300,0,.03,[.03,.01])}       // Sinú: ancho y lento
  if(t==='barrio'){layer(g,'lowpass',450,0,.14,[.07,.05])}
  if(t==='aula'){layer(g,'bandpass',320,1.2,.16,[2.6,.06]);layer(g,'bandpass',800,3,.05,[.3,.03])}       // ventilador + murmullo leve
  if(t==='debate'){[380,760,1300].forEach((f,i)=>layer(g,'bandpass',f,2.5,.13,[1.4+i*1.1,.1]))}
  return g}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.linearRampToValueAtTime(0,t+a+d)}
function bird(){const t=ctx.currentTime,kind=Math.random(),n=kind<.5?2+(Math.random()*3|0):2;
  for(let i=0;i<n;i++){const o=ctx.createOscillator(),g=ctx.createGain(),s=t+i*(kind<.5?.14:.32),f=kind<.5?2600+Math.random()*900:1700+Math.random()*300;
    o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(kind<.5?f*1.5:f*(i?0.8:1.25),s+(kind<.5?.07:.22));
    env(g,s,.02,.025,kind<.5?.08:.22);o.connect(g).connect(master);o.start(s);o.stop(s+.35)}}
function wind(){const t=ctx.currentTime,d=3+Math.random()*3,f=filt('bandpass',300,.7),g=ctx.createGain(),s=nz();
  f.frequency.setValueAtTime(250,t);f.frequency.linearRampToValueAtTime(650,t+d/2);f.frequency.linearRampToValueAtTime(300,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+d/2);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f).connect(g).connect(master);s.stop(t+d+.1)}
function lap(){const t=ctx.currentTime,f=filt('bandpass',380+Math.random()*200,1.5),g=ctx.createGain(),s=nz();env(g,t,.05,.035,.35);s.connect(f).connect(g).connect(master);s.stop(t+.5)}
function tick(){if(!on)return;const r=Math.random();
  if(OUT[cur]&&r<.08){if(!playS('amb_aves',.5,Math.random()*15,4+Math.random()*3))bird()}
  else if(OUT[cur]&&r<.12){if(!playS('amb_viento',.6,Math.random()*30,5+Math.random()*3))wind()}
}
function setAmb(t){visible=t;if(!ctx||!on)return;if(!amb[t])amb[t]=make(t);cur=t;if(t==='rio')rioLoop();Object.entries(amb).forEach(([k,g])=>g.gain.setTargetAtTime(k===t?1:0,ctx.currentTime,.8))}

/* Expresiones no verbales (síntesis de formantes): hmm, risa, asombro, suspiro, asco… */
const VOICE={'MARIANA':210,'YEIMI':265,'COMPAÑERA':290,'ANDRÉS':135,'DON AURELIO':115,'ESTUDIANTE':175,'ESTUDIANTE 1':180,'ESTUDIANTE 2':160};
const VOW={a:[800,1200],e:[500,1800],o:[500,900],u:[320,800],m:[250,0]};
function voice(t,f0,vow,dur,pitch,peak){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(f0*pitch[0],t);o.frequency.linearRampToValueAtTime(f0*pitch[1],t+dur);
  const [f1,f2]=VOW[vow],mix=ctx.createGain();mix.gain.value=1;
  if(f2){const b1=filt('bandpass',f1,6),b2=filt('bandpass',f2,8),g2=ctx.createGain();g2.gain.value=.5;o.connect(b1).connect(mix);o.connect(b2).connect(g2).connect(mix)}
  else o.connect(filt('lowpass',f1+f0,1)).connect(mix);
  mix.connect(g).connect(master);env(g,t,.04,peak,dur);o.start(t);o.stop(t+dur+.1)}
function breath(t,dur,peak,f){const s=nz(),b=filt('bandpass',f||1400,.8),g=ctx.createGain();b.frequency.linearRampToValueAtTime((f||1400)*.6,t+dur);env(g,t,dur*.3,peak,dur*.7);s.connect(b).connect(g).connect(master);s.stop(t+dur+.1)}
const FEM={'MARIANA':1,'YEIMI':1,'COMPAÑERA':1};
function sample(type,who){const fem=FEM[who];
  return {hmm:fem?'hmm_m':'hmm_h',risa:who==='YEIMI'?'risa_yeimi':who==='DON AURELIO'?'risa_aurelio':'risa_mariana',
    asombro:fem?'asombro_f':'asombro_m',oh:'oh',suspiro:fem?'suspiro_f':'suspiro_m',asco:'asco'}[type]}
function expr(type,who){if(!on||!type)return;const sm=sample(type,who);if(sm&&playS(sm,.9))return;const t=ctx.currentTime+.05,f=VOICE[who]||190;
  if(type==='hmm'){voice(t,f,'m',.28,[1,.92],.5);voice(t+.34,f,'m',.3,[.95,1.05],.45)}
  if(type==='risa'){for(let i=0;i<4;i++){breath(t+i*.16,.06,.06,1800);voice(t+i*.16,f,'a',.09,[1.15-i*.05,1.05-i*.05],.35)}}
  if(type==='asombro'){breath(t,.18,.12,2000);voice(t+.05,f,'a',.32,[1,1.35],.35)}
  if(type==='oh'){voice(t,f,'o',.4,[1.1,.9],.45)}
  if(type==='suspiro'){breath(t,.9,.12,1200)}
  if(type==='asco'){voice(t,f*.85,'u',.38,[1,.8],.45);breath(t,.3,.05,900)}
  if(type==='eh'){voice(t,f,'e',.22,[1,1.2],.4)}
  if(type==='ping'){[880,1320].forEach((fr,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=fr;env(g,t+i*.11,.01,.08,.18);o.connect(g).connect(master);o.start(t+i*.11);o.stop(t+i*.11+.3)})}
  if(type==='error'){[440,330].forEach((fr,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=fr;env(g,t+i*.16,.01,.1,.16);o.connect(g).connect(master);o.start(t+i*.16);o.stop(t+i*.16+.3)})}}

const sb=document.getElementById('sound'),vol=document.getElementById('vol'),rv=scenes[4].querySelector('#river');
vol.value=.5;vol.oninput=()=>{if(master)master.gain.value=+vol.value};
function toggle(){if(!ctx){ctx=new AudioContext();noiseBuf=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    master=ctx.createGain();master.gain.value=+vol.value;master.connect(ctx.destination);setInterval(tick,1000);loadSamples()}
  on=!on;sb.setAttribute('aria-pressed',on);sb.textContent=on?'🔊 Sonido':'🔇 Sonido';
  rv.setAttribute('aria-pressed',on);rv.textContent=on?'⏸ Pausar sonido':'▶ Escuchar al río';
  if(on){ctx.resume();setAmb(visible)}else Object.values(amb).forEach(g=>g.gain.setTargetAtTime(0,ctx.currentTime,.3))}
sb.onclick=toggle;
rv.onclick=()=>{if(on&&cur==='rio'){toggle();return}if(!on)toggle();setAmb('rio')};


build();
</script>
